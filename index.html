<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Capy Commons — The Gathering</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1408;
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  /* ---------- Title screen ---------- */
  #title-screen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background:
      linear-gradient(180deg,
        #7f6a9e 0%, #c98a6b 28%, #f2b26a 46%,
        #e8a75d 52%, #3d4d2e 60%, #2c3a22 78%, #1d2a17 100%);
    transition: opacity 1.2s ease;
  }
  #title-screen.hidden { opacity: 0; pointer-events: none; }

  .sun {
    position: absolute; top: 34%; left: 50%;
    width: min(22vmin, 130px); height: min(22vmin, 130px);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #fff6d8 0%, #ffdf8e 45%, rgba(255,210,120,0) 72%);
    filter: blur(2px);
    animation: sunPulse 6s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: .95; }
    50%       { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
  }

  .water-band {
    position: absolute; top: 52%; left: 0; right: 0; height: 9%;
    background: linear-gradient(180deg, rgba(255,214,140,.55), rgba(120,140,110,.25));
    overflow: hidden;
  }
  .shimmer {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg,
      rgba(255,246,210,.35) 0 2px, transparent 2px 7px);
    animation: shimmer 3.4s linear infinite;
    opacity: .6;
  }
  @keyframes shimmer {
    from { transform: translateY(0); }
    to   { transform: translateY(7px); }
  }

  .capy-silhouette {
    position: absolute; top: 46.5%; left: 50%;
    transform: translateX(-50%);
    width: min(34vmin, 220px);
    opacity: .92;
    animation: bob 4.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%       { transform: translateX(-50%) translateY(-4px); }
  }

  .firefly {
    position: absolute;
    width: 5px; height: 5px; border-radius: 50%;
    background: #ffe9a8;
    box-shadow: 0 0 8px 3px rgba(255,233,168,.6);
    animation: drift 9s ease-in-out infinite;
    opacity: 0;
  }
  @keyframes drift {
    0%   { opacity: 0; transform: translate(0, 0); }
    20%  { opacity: .9; }
    50%  { opacity: .5; transform: translate(24px, -30px); }
    80%  { opacity: .9; }
    100% { opacity: 0; transform: translate(-12px, -60px); }
  }

  .title-block { position: relative; text-align: center; margin-top: -34vh; z-index: 5; }
  h1 {
    font-size: clamp(2.1rem, 8.5vmin, 4.2rem);
    letter-spacing: .06em;
    color: #fff8e3;
    text-shadow: 0 2px 14px rgba(80,40,10,.55), 0 0 40px rgba(255,220,150,.35);
    font-weight: normal;
  }
  h2 {
    margin-top: .4em;
    font-size: clamp(1rem, 3.6vmin, 1.6rem);
    letter-spacing: .42em; text-indent: .42em;
    color: #ffe9b8;
    text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(80,40,10,.6);
    font-weight: normal;
  }

  #begin-btn {
    position: absolute; bottom: 14%; left: 50%;
    transform: translateX(-50%);
    padding: .85em 2.6em;
    font-family: inherit;
    font-size: clamp(1rem, 3.2vmin, 1.35rem);
    letter-spacing: .12em;
    color: #2c2410;
    background: linear-gradient(180deg, #ffe9ad, #f4c169);
    border: 2px solid rgba(255,248,220,.8);
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 22px rgba(60,30,0,.4), inset 0 1px 0 rgba(255,255,255,.7);
    animation: breathe 3s ease-in-out infinite;
  }
  #begin-btn:active { transform: translateX(-50%) scale(.96); }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 4px 22px rgba(60,30,0,.4), 0 0 0 0 rgba(255,225,150,.5); }
    50%       { box-shadow: 0 4px 22px rgba(60,30,0,.4), 0 0 0 14px rgba(255,225,150,0); }
  }

  .tagline {
    position: absolute; bottom: 6.5%; left: 0; right: 0;
    text-align: center;
    color: rgba(255,240,210,.75);
    font-style: italic;
    font-size: clamp(.8rem, 2.4vmin, 1rem);
    letter-spacing: .05em;
    padding: 0 2em;
  }

  #loading-note {
    position: absolute; bottom: 2.2%; left: 0; right: 0;
    text-align: center;
    color: rgba(255,240,210,.45);
    font-size: .72rem; letter-spacing: .08em;
  }
</style>
</head>
<body>

<div id="title-screen">
  <div class="sun"></div>
  <div class="water-band"><div class="shimmer"></div></div>

  <!-- capybara silhouette, sitting serenely on the waterline -->
  <svg class="capy-silhouette" viewBox="0 0 200 110" aria-hidden="true">
    <path fill="#241a0e" d="
      M28,96 Q22,80 30,64 Q38,46 62,40 Q80,35 100,35
      Q118,34 132,30 Q138,20 146,18 Q154,16 158,22
      Q166,20 170,26 Q174,32 170,40 Q176,50 174,62
      Q172,78 158,88 Q140,98 112,99 Q66,101 44,99 Q32,98 28,96 Z"/>
    <ellipse cx="152" cy="38" rx="2.6" ry="3.4" fill="#1a1408"/>
    <path d="M12,99 H188" stroke="#241a0e" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
  </svg>

  <div class="title-block">
    <h1>Capy Commons</h1>
    <h2>The Gathering</h2>
  </div>

  <button id="begin-btn">Begin</button>
  <div class="tagline">The wetland is waking. Old friends are waiting to be found.</div>
  <div id="loading-note"></div>
</div>

<script>
  // Scatter a few fireflies over the title screen
  (function () {
    const screen = document.getElementById('title-screen');
    for (let i = 0; i < 12; i++) {
      const f = document.createElement('div');
      f.className = 'firefly';
      f.style.left = (8 + Math.random() * 84) + '%';
      f.style.top = (55 + Math.random() * 38) + '%';
      f.style.animationDelay = (Math.random() * 9) + 's';
      f.style.animationDuration = (7 + Math.random() * 6) + 's';
      screen.appendChild(f);
    }
  })();

  document.getElementById('begin-btn').addEventListener('click', () => {
    const note = document.getElementById('loading-note');
    note.textContent = 'The wetland is still forming… check back soon.';
  });
</script>

</body>
</html>
